<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escreva-se na nossa Newsletter</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <header class="container">
        <div class="logo">
            <img src="img/logo.png" alt="Hora de Codar Logo">
            <h2>Hora de Codar</h2>
        </div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Serviços</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
            <a href="#">FAQ</a>
        </nav>
    </header>
    <main class="container">
        <div class="content">
            <h1>
            Inscreva-se Agora <br /> 
            na Nossa <span>Newsletter</span>
            </h1>
            <p>
                Lorem ipsum dolor sit amet consectetur, adipisicing elit.
                Placeat quaerat deleniti corrupti minus dolorem, at beatae,
                 ad, illo animi doloremque incidunt. Ipsam perspiciatis ut 
                 animi amet a alias labore enim.
            </p>
            <form>
                <div class="form-group">
                    <input type="text" placeholder="Nome">
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
        <div class="image-container">
            <div class="ellipse"></div>
            <img src="img/banner.jpg" alt="Banner usuário digitando">
        </div>
    </main>
</body>
</html>
