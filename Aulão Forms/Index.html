<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Completo em HTML</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>
    <h1>Formulário Completo em HTML</h1>
    
    <!-- Criando o formulário -->
    <!-- Action => para onde os dados vão -->
    <!-- method => como o form vai ser enviado -->
    <form action="/registro" method="POST"></form>
    <!-- inputs = entradas -->
     <label for="nome">Nome:</label>
     <input type="text" name="nome" placeholder="Digite o seu primeiro nome" />

     <label for="email">E-mail:</label>
     <input type="email" name="email" placeholder="Digite o seu e-mail" />

     <label for="senha">Senha:</label>
     <input type="password" name="senha" placeholder="Digite a sua senha" />

    <!-- Texto mais longo - textarea -->
      <label for="mensagem">Mensagem</label>
      <textarea 
        name="mensagem" 
        placeholder="Digite o que você achou do sistema..."
        ></textarea>

    <!-- Formas de seleção -->
    <!-- Selecionar algo,
      quero exibir todas as opções,
      mas só pode selecionar 1 
      -->
    <h2>Preferências</h2>
    <p>Gênero:</p>

    <input type="radio" name="genero" value="Masculino">
    <label for="masculino">Masculino</label>

    <input type="radio" name="genero" value="Feminino">
    <label for="feminino">Feminino</label>

    <input type="radio" name="genero" value="Outro">
    <label for="outro">Outro</label>

    <!-- mas pode selecionar 1 ou + -->
     <p>Interesses:</p>

     <input type="checkbox" name="interesses" value="Música">
     <label for="musica">Música</label>
     
     <input type="checkbox" name="interesses" value="Esportes">
     <label for="esporte">Esporte</label>

     <input type="checkbox" name="interesses" value="Viagens">
     <label for="viagem">Viagem</label>

    <!-- Quero esconder as opções, limitar 1 -->
    <label for="cidade">Cidade:</label>
     <select name="cidade">
        <option value="">Selecione sua cidade</option>
        <option value="Manaus">Manaus</option>
        <option value="São Paulo">São Paulo</option>
        <option value="Rio de Janeiro">Rio de Janeiro</option>
     </select>

     <!-- tipos HTML5 -->
      <label for="data_nascimento">Data de Nascimento:</label>
      <input type="date" name="data_nascimento">

      <label for="hora_contato">Selecione o horário:</label>
      <input type="time" name="hora_contato">
      
      <label for="cor">Selecione a cor:</label>
      <input type="color" name="cor">

    <!-- Envio de arquivos -->
     <div>
        <input type="file" name="arquivo" accept=".pdf, .png">
     </div>

     <div>
        <input type="file" name="arquivo" accept=".pdf, .png" multiple>
     </div>
     


    <!-- Botão de ação = submit -->
    <!-- <input type="submit" value="Enviar"> -->
     <div>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar form</button>
     </div>
</body>
</html>
