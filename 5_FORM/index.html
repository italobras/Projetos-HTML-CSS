<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h2>Formulários HTML</h2>
    <!-- 1 - Primeiro formulário -->
     <!-- 2 - Atributos do formulário -->
    <form action="register.php" method="GET">
       <div>
        <label>Nome:</label>
        <input type="text" />
       </div>
       <!-- 3 - Atributo name -->
        <div>
          <!-- 4 - Atributo label -->
            <labe for="Age">Idade:</label>
            <input type="text" name="Age">
        </div>
        <!-- 6 - Select -->
        <div>
            <label for="job">Selecione a sua profissão</label>
            <select name="job">
                <option value="programador">Programador</option>
                <option value="tester">Tester/QA</option>
                <option value="devops">DevOps</option>
            </select>
        </div>
        <!-- 7 - Atributo selected -->
         <div>
            <label for="contract">Você leu os termos de contrato?</label>
            <select name="contract">
                <option value="sim">Sim </option>
                <option value="nao">Não</option>
            </select>
         </div>
         <!-- 8 - Multiplas opções -->
          <div>
            <label for="items">Selecione os itens desejados</label>
            <select name="items" multiple>
                <option value="pera">Pera</option>
                <option value="feijao">Feijão</option>
                <option value="arroz">Arroz</option>
                <option value="milho">Milho</option>
                <option value="farinha">Farinha</option>
            </select>
          </div>
        <!-- 9 - Textarea -->
         <div>
            <label for="comment">Escreva abaixo sobre o que você achou do post:</label>
            <textarea name="comment"></textarea>
         </div>
        <!-- 10 - Fieldset e legend -->
         <div>
            <fieldset>
                <legend>Preencha as suas informações:</legend>
                <label for="firstname">Nome:</label>
                <input type="text" name="firstname">
                <label for="lastname">Sobrenome:</label>
                <input type="text" name="lastname">
            </fieldset>
         </div>
         <!-- 11 - datalist -->
          <div>
            <label for="flavor">Escolha o sabor:</label>
            <input type="text" list="flavors" name="flavor">

            <datalist id="flavors">
                <option value="cereja">Cereja</option>
                <option value="morango">Morango</option>
                <option value="amendoim">Amendoim</option>
                <option value="uva">Uva</option>
            </datalist>
          </div>

        <!-- 12 - Senha -->
         <div>
            <label for="password">Digite a sua senha:</label>
            <input type="password" name="password">
         </div>

         <!-- 14 - Radio buttom -->
          <div>
            <label for="car_model">Escolha um modelo do seu carro:</label>
            <div class="radio">
                <input type="radio" value="bmw" name="car_model">
                <label for="bmw">BMW</label>
            </div>
            <div class="radio">
                <input type="radio" value="ferrari" name="car_model">
                <label for="ferrari">Ferrari</label>
            </div>
            <div class="radio">
                <input type="radio" value="renault" name="car_model">
                <label for="renault">Renault</label>
            </div>
          </div>

        <!-- 15 - Checkbox -->
         <div>
            <label for="optional">Opcionais do carro:</label>
            <div class="radios">
                <input type="checkbox" name="optionals[]" value="big_tires">
                <label for="big_tires">Pneus grandes</label>
            </div>
            <div class="radios">
                <input type="checkbox" name="optionals[]" value="turbo-engine">
                <label for="turbo_engine">Motor turbo</label>
            </div>
            <div class="radios">
                <input type="checkbox" name="optionals[]" value="hybrid">
                <label for="hybrid">Híbrido</label>
            </div>
         </div>

        <!-- 16 - Datas -->
         <div>
            <label for="brithday">Data de nascimento:</label>
            <input type="date" name="brithday">
         </div>

         <!-- 17 - Arquivos -->
          <div>
            <label for="image">Insira a sua imagem:</label>
            <input type="file" name="image">
          </div>

        <!-- 18 - Números -->
          <div>
            <label for="salary">Quanto você ganha no seu emprego atual?</label>
            <input type="number" name="salary">
          </div>

        <!-- 19 - Emails -->
         <div>
            <label for="email">Digite o seu e-mail:</label>
            <input type="email" name="email">
         </div>

        <!-- 20 - Value -->
         <div>
            <label for="value">Digite algum valor</label>
            <input type="text" value="O meu valor é este 2" name="value">
         </div>

         <!-- 21 - Disabled -->
          <div>
            <p>Tente mudar o valor</p>
            <input type="text" value="Não precisa preencher" disabled>
          </div>

        <!-- 22 - Placeholder -->
         <div>
            <label for="currentjob">Digite sua profissão:</label>
            <input type="text" name="currentjob" placeholder="No que você está trabalhando agora?">
         </div>

        <!-- 23 - Required -->
        <div>
            <label for="birthyear">Ano de nascimento:</label>
            <input type="text" placeholder="Digite o ano que você nasceu" required>
        </div>

        <!-- 13 - Resetar form -->
         <div>
            <input type="reset" value="Limpar">
         </div>         
        <!-- 5 - Envio de form -->
         <input type="submit" value="Enviar"/>
    
</body>
</html>
